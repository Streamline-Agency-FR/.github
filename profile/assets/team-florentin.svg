<svg xmlns="http://www.w3.org/2000/svg" width="400" height="410" viewBox="0 0 400 410" role="img" aria-label="Florentin (cauctoflo) — Lead dev">
  <style>
  text { font-family: 'Inter','Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

    .spin { animation: spin 8s linear infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes spin { to { transform: rotate(360deg) } }
  </style>
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7C948"/><stop offset=".5" stop-color="#F7C948" stop-opacity=".05"/><stop offset="1" stop-color="#E0A800"/></linearGradient>
    <radialGradient id="h" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#F7C948" stop-opacity=".18"/><stop offset="1" stop-color="#F7C948" stop-opacity="0"/></radialGradient>
    <clipPath id="av"><circle cx="200" cy="130" r="74"/></clipPath>
    <clipPath id="c"><rect width="400" height="410" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="400" height="410" fill="#121214"/>
    <circle cx="200" cy="130" r="170" fill="url(#h)"/>
    <circle class="spin" cx="200" cy="130" r="86" fill="none" stroke="url(#ring)" stroke-width="4" stroke-dasharray="380 160" stroke-linecap="round"/>
    <image href="data:image/jpeg;base64," x="126" y="56" width="148" height="148" clip-path="url(#av)" preserveAspectRatio="xMidYMid slice"/>
    <text x="200" y="252" text-anchor="middle" font-size="30" font-weight="800" fill="#FAFAFA">Florentin</text>
    <text x="200" y="278" text-anchor="middle" font-size="14" fill="#A1A1AA">@cauctoflo</text>
    <g transform="translate(200 296)">
