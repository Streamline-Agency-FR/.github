      <text y="19" text-anchor="middle" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#F7C948">LEAD DEV</text>
    </g>
    <text x="200" y="354" text-anchor="middle" font-size="14" fill="#D4D4D8">Dashboard · Overlay</text><text x="200" y="378" text-anchor="middle" font-size="14" fill="#D4D4D8">Minecraft</text>
