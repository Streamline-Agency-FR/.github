<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-label="Streamline Agency — agence TikTok LIVE n°1 en France, n°1 Gaming en Europe">
  <style>
  text { font-family: 'Inter','Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

    .glow { animation: drift 14s ease-in-out infinite alternate; transform-origin: center; }
    .glow2 { animation: drift2 18s ease-in-out infinite alternate; }
    .spark { animation: twinkle 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .dot { animation: pulse 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .ring { animation: ring 1.6s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    .scan { animation: scan 6s linear infinite; }
    @keyframes drift { from { transform: translate(-120px,-20px); } to { transform: translate(140px,30px); } }
    @keyframes drift2 { from { transform: translate(100px,20px); } to { transform: translate(-160px,-10px); } }
    @keyframes twinkle { 0%,100% { opacity:.25; transform: scale(.7) } 50% { opacity:1; transform: scale(1.1) } }
    @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:.45 } }
    @keyframes ring { from { opacity:.8; transform: scale(1) } to { opacity:0; transform: scale(2.6) } }
    @keyframes scan { from { transform: translateX(-400px) } to { transform: translateX(1680px) } }
  </style>
  <defs>
    
  <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
  </pattern>
  <radialGradient id="g-mask-g" cx="50%" cy="45%" r="65%">
    <stop offset="0" stop-color="#fff" stop-opacity="1"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </radialGradient>
  <mask id="g-mask"><rect width="1280" height="440" fill="url(#g-mask-g)"/></mask>
    <radialGradient id="gl" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#F7C948" stop-opacity=".30"/>
      <stop offset="1" stop-color="#F7C948" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gl2" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FF5C47" stop-opacity=".14"/>
      <stop offset="1" stop-color="#FF5C47" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#F7C948" stop-opacity="0"/>
      <stop offset=".5" stop-color="#F7C948"/>
      <stop offset="1" stop-color="#F7C948" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scanG" x1="0" x2="1">
      <stop offset="0" stop-color="#F7C948" stop-opacity="0"/>
      <stop offset=".5" stop-color="#F7C948" stop-opacity=".08"/>
      <stop offset="1" stop-color="#F7C948" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect width="1280" height="440" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1280" height="440" fill="#09090B"/>
    <ellipse class="glow" cx="640" cy="220" rx="520" ry="260" fill="url(#gl)"/>
    <ellipse class="glow2" cx="998.4000000000001" cy="308" rx="360" ry="200" fill="url(#gl2)"/>
    <rect width="1280" height="440" fill="url(#g)" mask="url(#g-mask)"/>
    <rect class="scan" x="0" y="0" width="400" height="440" fill="url(#scanG)"/>

    <!-- badge LIVE -->
    <g transform="translate(548 46)">
      <rect width="184" height="34" rx="17" fill="#18181B" stroke="#27272A"/>
      <circle class="ring" cx="22" cy="17" r="6" fill="none" stroke="#FF5C47" stroke-width="2"/>
      <circle class="dot" cx="22" cy="17" r="6" fill="#FF5C47"/>
      <text x="38" y="22" font-size="13" font-weight="700" letter-spacing="2.4" fill="#FAFAFA">TIKTOK LIVE · EU</text>
    </g>

    <image href="data:image/png;base64," x="360" y="98" width="560" height="188"/>

    
  <path class="spark" style="animation-delay:0s" transform="translate(230 120) scale(1.2)"
    d="M0 -10 C1 -3 3 -1 10 0 C3 1 1 3 0 10 C-1 3 -3 1 -10 0 C-3 -1 -1 -3 0 -10Z" fill="#F7C948"/>
  <path class="spark" style="animation-delay:1.1s" transform="translate(1060 150) scale(0.9)"
    d="M0 -10 C1 -3 3 -1 10 0 C3 1 1 3 0 10 C-1 3 -3 1 -10 0 C-3 -1 -1 -3 0 -10Z" fill="#F7C948"/>
  <path class="spark" style="animation-delay:2s" transform="translate(170 330) scale(0.7)"
    d="M0 -10 C1 -3 3 -1 10 0 C3 1 1 3 0 10 C-1 3 -3 1 -10 0 C-3 -1 -1 -3 0 -10Z" fill="#F7C948"/>
  <path class="spark" style="animation-delay:0.6s" transform="translate(1120 330) scale(1.1)"
    d="M0 -10 C1 -3 3 -1 10 0 C3 1 1 3 0 10 C-1 3 -3 1 -10 0 C-3 -1 -1 -3 0 -10Z" fill="#F7C948"/>
  <path class="spark" style="animation-delay:1.6s" transform="translate(980 80) scale(0.6)"
    d="M0 -10 C1 -3 3 -1 10 0 C3 1 1 3 0 10 C-1 3 -3 1 -10 0 C-3 -1 -1 -3 0 -10Z" fill="#F7C948"/>
  <path class="spark" style="animation-delay:2.4s" transform="translate(310 250) scale(0.5)"
    d="M0 -10 C1 -3 3 -1 10 0 C3 1 1 3 0 10 C-1 3 -3 1 -10 0 C-3 -1 -1 -3 0 -10Z" fill="#F7C948"/>

    <rect x="380" y="310" width="520" height="2" fill="url(#line)"/>
    <text x="640" y="352" text-anchor="middle" font-size="26" font-weight="800" fill="#FAFAFA" letter-spacing=".5">Agence TikTok LIVE <tspan fill="#F7C948">n°1 en France</tspan> · <tspan fill="#F7C948">n°1 Gaming en Europe</tspan></text>
    <text x="640" y="388" text-anchor="middle" font-size="16" fill="#A1A1AA" letter-spacing="1.2">Primée par TikTok LIVE en 2025 et en 2026</text>
  </g>
  <rect x=".5" y=".5" width="1279" height="439" rx="24" fill="none" stroke="#27272A"/>
</svg>
