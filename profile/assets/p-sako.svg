<svg xmlns="http://www.w3.org/2000/svg" width="620" height="340" viewBox="0 0 620 340" role="img" aria-label="SAKO — Outil interne">
  <style>
  text { font-family: 'Inter','Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

    .zoom { animation: zoom 14s ease-in-out infinite alternate; transform-origin: 50% 50%; }
    .float { animation: float 4s ease-in-out infinite; }
    .dot { animation: blink 1.6s ease-in-out infinite; }
    @keyframes zoom { from { transform: scale(1) } to { transform: scale(1.07) } }
    @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-7px) } }
    @keyframes blink { 0%,100% { opacity:1 } 50% { opacity:.3 } }
  </style>
  <defs>
    <clipPath id="c"><rect width="620" height="340" rx="16"/></clipPath>
    <clipPath id="cv"><rect width="620" height="210"/></clipPath>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset=".45" stop-color="#09090B" stop-opacity="0"/><stop offset="1" stop-color="#09090B" stop-opacity=".92"/>
    </linearGradient>
    <radialGradient id="bgArt" cx="50%" cy="60%" r="70%">
      <stop offset="0" stop-color="#F7C948" stop-opacity=".35"/><stop offset="1" stop-color="#09090B"/>
    </radialGradient>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#fff" fill-opacity=".07"/></pattern>
  </defs>
  <g clip-path="url(#c)">
    <rect width="620" height="340" fill="#09090B"/>
    <g clip-path="url(#cv)"><rect width="620" height="210" fill="url(#bgArt)"/>
       <rect width="620" height="210" fill="url(#dots)"/>
       <image href="data:image/png;base64," x="225" y="18" width="170" height="170" class="float"/></g>
    <rect width="620" height="210" fill="url(#fade)"/>
    
    
    <text x="28" y="240" font-size="24" font-weight="800" fill="#FAFAFA">SAKO</text>
    <text x="28" y="262" font-size="11.5" font-weight="700" letter-spacing="1.8" fill="#F7C948">OUTIL INTERNE</text>
    <text x="28" y="286" font-size="14.5" fill="#A1A1AA">Notre outil de gestion de projet.</text>
    <g transform="translate(28 296)"><rect width="72" height="24" rx="6" fill="#18181B"/><text x="36" y="16.5" text-anchor="middle" font-size="12" font-weight="600" fill="#A1A1AA">Laravel</text></g><g transform="translate(106 296)"><rect width="80" height="24" rx="6" fill="#18181B"/><text x="40" y="16.5" text-anchor="middle" font-size="12" font-weight="600" fill="#A1A1AA">Livewire</text></g>
  </g>
  <rect x=".5" y=".5" width="619" height="339" rx="16" fill="none" stroke="#27272A"/>
</svg>
